spring.datasource.password=K36bd8nfGKF0M2st
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================
# JPA / HIBERNATE
# ===================================
# SET TO 'none' TO SPEED UP STARTUP TIME ON DEPLOY
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.data.jpa.repository.packages=com.fattiebakery.repository

# ===================================
# THYMELEAF
# ===================================
spring.thymeleaf.cache=true
spring.thymeleaf.encoding=UTF-8

# ===================================
# FILE UPLOAD
# ===================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# File storage settings
app.upload.dir=uploads/images

# ===================================
# OAUTH2 CONFIGURATION (GOOGLE)
# ===================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
# Force Google to show account selection screen
spring.security.oauth2.client.registration.google.authorization-params.prompt=select_account

# GitHub OAuth2
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email,read:user

# ===================================
# STATIC RESOURCES & LOGGING
# ===================================
logging.level.root=INFO
logging.level.com.fattiebakery=INFO
logging.level.org.springframework.security=INFO

# ===================================
# STATIC RESOURCES
# ===================================
spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/static/,file:uploads/

# ===================================
# DEVTOOLS
# ===================================
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
