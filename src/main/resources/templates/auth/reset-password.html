<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Đặt Lại Mật Khẩu - Fattie Bakery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
    <style>
        :root { --logo-red: #8B3238; --logo-red-dark: #6F282D; --border-tan: #EADCC9; }
        body { font-family: 'Montserrat', sans-serif; background: #FFFDF8; min-height: 100vh; display: flex; align-items: center; }
        .card { border: 1px solid var(--border-tan); border-radius: 0 !important; background: #ffffff; box-shadow: 0 10px 30px rgba(139, 50, 56, 0.04); }
        .btn-bakery { background: var(--logo-red) !important; color: white !important; border-radius: 0 !important; padding: 12px; font-weight: 700; text-transform: uppercase; }
        .btn-bakery:hover { background: var(--logo-red-dark) !important; }
        .form-control { border-radius: 0 !important; padding: 12px 15px; border: 1px solid var(--border-tan); }
        .brand-title { font-family: 'Playfair Display', serif; color: var(--logo-red); font-size: 2.2rem; font-weight: 700; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-4">
                <div class="brand-title">Fattie Bakery</div>
                <p class="text-muted small fw-medium mt-1">Nhập mật khẩu mới cho tài khoản của bạn</p>
            </div>

            <div class="card p-4 p-md-5">
                <h4 class="fw-800 text-center mb-4 text-dark font-playfair">ĐẶT LẠI MẬT KHẨU</h4>

                <div th:if="${error}" class="alert alert-danger rounded-0 small" th:text="${error}"></div>
                <div th:if="${success}" class="alert alert-success rounded-0 small" th:text="${success}"></div>

                <form th:action="@{/reset-password}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
                    <!-- Truyền ngầm email/username để Controller biết tài khoản nào cần cập nhật -->
                    <input type="hidden" name="email" th:value="${email}"/>

                    <div class="mb-3">
                        <label class="form-label fw-600 small text-dark">Mật khẩu mới</label>
                        <input type="password" class="form-control" name="newPassword" placeholder="••••••••" required/>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-600 small text-dark">Xác nhận mật khẩu mới</label>
                        <input type="password" class="form-control" name="confirmPassword" placeholder="••••••••" required/>
                    </div>

                    <button type="submit" class="btn btn-bakery w-100 mb-3">Cập Nhật Mật Khẩu</button>
                </form>

                <div class="text-center mt-3 pt-2 border-top">
                    <a href="/login" class="small text-decoration-none" style="color: var(--logo-red); font-weight: 600;">
                        <i class="fas fa-arrow-left me-1"></i> Quay lại đăng nhập
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
