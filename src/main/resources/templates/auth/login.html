<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Đăng Nhập - Fattie Bakery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
    <style>
        :root { --logo-red: #8B3238; --logo-red-dark: #6F282D; --border-tan: #EADCC9; }
        body { font-family: 'Montserrat', sans-serif; background: #FFFDF8; min-height: 100vh; display: flex; align-items: center; }
        .card { border: 1px solid var(--border-tan); border-radius: 0 !important; background: #ffffff; box-shadow: 0 10px 30px rgba(139, 50, 56, 0.04); }
        .btn-bakery-login { background: var(--logo-red) !important; color: white !important; border-radius: 0 !important; padding: 12px; font-weight: 700; text-transform: uppercase; }
        .btn-bakery-login:hover { background: var(--logo-red-dark) !important; }
        .form-control { border-radius: 0 !important; padding: 12px 15px; border: 1px solid var(--border-tan); }
        .input-group-text { border-radius: 0 !important; border: 1px solid var(--border-tan); background: #FAF6F0 !important; }
        .brand-title { font-family: 'Playfair Display', serif; color: var(--logo-red); font-size: 2.2rem; font-weight: 700; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-4">
                <div class="brand-title">Fattie Bakery</div>
                <p class="text-muted small fw-medium mt-1">Chào mừng bạn ghé tiệm bánh thơm!</p>
            </div>

            <div class="card p-4 p-md-5">
                <h4 class="fw-800 text-center mb-4 text-dark font-playfair">ĐĂNG NHẬP</h4>

                <div th:if="${error}" class="alert alert-danger rounded-0 small" th:text="${error}"></div>
                <div th:if="${message}" class="alert alert-success rounded-0 small" th:text="${message}"></div>
                <div th:if="${success}" class="alert alert-success rounded-0 small" th:text="${success}"></div>

                <form action="/login" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>

                    <!-- Ô nhập Tên đăng nhập -->
                    <div class="mb-3">
                        <label class="form-label fw-600 small text-dark">Tên đăng nhập</label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0"><i class="fas fa-user" style="color:var(--logo-red)"></i></span>
                            <input type="text" class="form-control border-start-0" name="username" placeholder="Nhập tên đăng nhập" required/>
                        </div>
                    </div>

                    <!-- 👉 ĐẶT ĐOẠN MÃ NÀY VÀO ĐÂY (Phần nhập Mật khẩu & Quên mật khẩu) -->
                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label fw-600 small text-dark mb-0">Mật khẩu</label>
                            <a href="/forgot-password" class="small text-decoration-none" style="color:var(--logo-red);">Quên mật khẩu?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text border-end-0"><i class="fas fa-lock" style="color:var(--logo-red)"></i></span>
                            <input type="password" class="form-control border-start-0" name="password" placeholder="Nhập mật khẩu" required/>
                        </div>
                    </div>

                    <!-- Nút bấm Đăng nhập -->
                    <button type="submit" class="btn btn-bakery-login w-100"><i class="fas fa-sign-in-alt me-2"></i>Vào Tiệm Bánh</button>
                </form>

                <div class="text-center mt-4 pt-2 border-top">
                    <span class="text-muted small">Chưa có tài khoản? </span>
                    <a href="/register" style="color:var(--logo-red); font-weight:700; text-decoration:none;" class="small">Đăng ký ngay</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
