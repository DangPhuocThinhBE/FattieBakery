<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Đăng Nhập - Fattie Bakery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --logo-red: #8B3238;
            --logo-red-dark: #6F282D;
            --border-tan: #EADCC9;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background: #FFFDF8; /* Nền kem ấm của tiệm bánh */
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        /* Form vuông vức mộc mạc */
        .card {
            border: 1px solid var(--border-tan);
            border-radius: 0 !important;
            box-shadow: 0 10px 30px rgba(139, 50, 56, 0.04);
            background: #ffffff;
        }

        /* Nút bấm phẳng */
        .btn-bakery-login {
            background: var(--logo-red) !important;
            color: white !important;
            border: none !important;
            border-radius: 0 !important;
            padding: 12px;
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: 0.3s;
        }
        .btn-bakery-login:hover { background: var(--logo-red-dark) !important; }

        /* Ô nhập liệu phẳng */
        .form-control {
            border-radius: 0 !important;
            padding: 12px 15px;
            border: 1px solid var(--border-tan);
            font-size: 0.95rem;
        }
        .form-control:focus {
            border-color: var(--logo-red);
            box-shadow: 0 0 0 .25rem rgba(139, 50, 56, .1);
        }
        .input-group-text {
            border-radius: 0 !important;
            border: 1px solid var(--border-tan);
            background: #FAF6F0 !important;
        }

        .brand-title { font-family: 'Playfair Display', serif; color: var(--logo-red); font-size: 2.2rem; font-weight: 700; }

        /* Định dạng các nút đăng nhập MXH vuông vức */
        .btn-social {
            border-radius: 0 !important;
            font-weight: 700;
            padding: 10px;
            font-size: 0.9rem;
            text-align: center;
            display: block;
            text-decoration: none;
            transition: 0.2s;
        }
    </style>
</head>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-4">

                         alt="Fattie Bakery" style="height: 70px; object-fit: contain;">
                </div>
                <div class="brand-title">Fattie Bakery</div>
                <p class="text-muted small fw-medium mt-1">Chào mừng bạn ghé tiệm bánh thơm!</p>
            </div>

            <div class="card p-4 p-md-5">
                <h4 class="fw-800 text-center mb-4 text-dark font-playfair">ĐĂNG NHẬP</h4>

                <div th:if="${error}" class="alert alert-danger rounded-0 small" th:text="${error}"></div>
                <div th:if="${message}" class="alert alert-success rounded-0 small" th:text="${message}"></div>
                <div th:if="${success}" class="alert alert-success rounded-0 small" th:text="${success}"></div>

                <form action="/login" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="mb-3">
                        <label class="form-label fw-600 small text-dark">Tên đăng nhập</label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0">
                                <i class="fas fa-user" style="color:var(--logo-red)"></i>
                            </span>
                            <input type="text" class="form-control border-start-0" name="username"
                                   placeholder="Nhập tên đăng nhập" required/>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-600 small text-dark">Mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0">
                                <i class="fas fa-lock" style="color:var(--logo-red)"></i>
                            </span>
                            <input type="password" class="form-control border-start-0" name="password"
                                   placeholder="Nhập mật khẩu" required/>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-bakery-login w-100">
                        <i class="fas fa-sign-in-alt me-2"></i>Vào Tiệm Bánh
                    </button>
                </form>

                <div class="divider d-flex align-items-center my-4">
                    <hr class="flex-grow-1" style="border-top: 1px dashed var(--border-tan);">
                    <span class="mx-3 text-muted fw-bold small" style="font-size: 11px;">HOẶC</span>
                    <hr class="flex-grow-1" style="border-top: 1px dashed var(--border-tan);">
                </div>

                <!-- 🛒 ĐÃ CẬP NHẬT THEO ĐÚNG YÊU CẦU: GOOGLE, FACEBOOK & SỐ ĐIỆN THOẠI -->
                <div class="d-grid gap-2">
                    <a th:href="@{/oauth2/authorization/google}" class="btn btn-outline-danger btn-social">
                        <i class="fab fa-google me-2"></i> Tiếp tục với Google
                    </a>
                    <a th:href="@{/oauth2/authorization/facebook}" class="btn btn-outline-primary btn-social">
                        <i class="fab fa-facebook-f me-2"></i> Tiếp tục với Facebook
                    </a>
                    <a th:href="@{/login/phone}" class="btn btn-outline-secondary btn-social">
                        <i class="fas fa-phone-alt me-2"></i> Tiếp tục bằng Số điện thoại
                    </a>
                </div>

                <div class="text-center mt-4 pt-2 border-top" style="border-color: #FAF6F0 !important;">
                    <span class="text-muted small">Chưa có tài khoản? </span>
                    <a href="/register" style="color:var(--logo-red); font-weight:700; text-decoration:none;" class="small">Đăng ký ngay</a>
                </div>
                <div class="text-center mt-3">
                    <a href="/" class="text-muted small text-decoration-none"><i class="fas fa-home me-1"></i>Quay lại trang chủ</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
