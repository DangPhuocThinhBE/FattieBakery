<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: main_layout(~{::section}, 'Cửa Hàng', ~{::extraStyles})}">
<head>
    <meta charset="UTF-8"/>
    <th:block th:fragment="extraStyles">
        <style>
            :root{
                --primary:#8B3238;
                --primary-dark:#6a252a;
            }

            .category-chip{
                border-radius:50px;
                padding:8px 20px;
                font-weight:700;
                border:2px solid #fff0f5;
                background:#fff;
                text-decoration:none;
                color:#333;
                transition:.25s;
            }

            .category-chip:hover,
            .category-chip.active{
                background:var(--primary);
                color:#fff!important;
                border-color:var(--primary);
            }

            .product-card{
                border:none;
                border-radius:20px;
                overflow:hidden;
                box-shadow:0 5px 18px rgba(0,0,0,.08);
                transition:.3s;
                height:100%;
                display: flex;
                flex-direction: column;
            }

            .product-card:hover{
                transform:translateY(-8px);
                box-shadow:0 10px 30px rgba(0,0,0,.12);
            }

            .product-img-wrap{
                height:240px;
                overflow:hidden;
                background:#fafafa;
            }

            .product-img-wrap img{
                width:100%;
                height:100%;
                object-fit:cover;
                transition:.35s;
            }

            .product-card:hover img{
                transform:scale(1.08);
            }

            .price-tag{
                color:var(--primary);
                font-weight:700;
                font-size:1.1rem;
            }

            .card-body {
                display: flex;
                flex-direction: column;
                flex-grow: 1;
            }

            .pagination .page-link {
                color: var(--primary);
                border-radius: 8px;
                margin: 0 4px;
                border: 1px solid #dee2e6;
            }

            .pagination .page-item.active .page-link {
                background-color: var(--primary);
                border-color: var(--primary);
                color: #fff;
            }

            .pagination .page-link:hover {
                background-color: #fff0f5;
                color: var(--primary-dark);
            }
        </style>
    </th:block>
    <title>Cửa Hàng</title>
</head>
<body>
<section class="container py-5">
    <!-- Header danh mục kết hợp bộ chọn số lượng hiển thị -->
    <div class="d-flex justify-content-between align-items-center mb-5 flex-wrap gap-3">
        <h2 class="fw-bold m-0">
            Khám Phá Cửa Hàng
        </h2>

        <!-- Dropdown cho phép người dùng thay đổi số lượng sản phẩm hiển thị -->
        <div class="d-flex align-items-center gap-2">
            <label for="pageSizeSelect" class="form-label mb-0 fw-semibold text-muted">Hiển thị:</label>
            <select id="pageSizeSelect" class="form-select form-select-sm rounded-pill px-3" style="width: 90px;" onchange="changePageSize(this)">
                <option value="8" th:selected="${size == 8}">8</option>
                <option value="12" th:selected="${size == 12}">12</option>
                <option value="24" th:selected="${size == 24}">24</option>
                <option value="36" th:selected="${size == 36}">36</option>
            </select>
        </div>

        <div class="d-flex flex-wrap gap-2">
            <a th:href="@{/shop(size=${size})}"
               class="category-chip"
               th:classappend="${selectedCategory == null}? ' active'">
                Tất cả
            </a>

            <a th:each="cat : ${categories}"
               th:href="@{/shop(category=${cat.id}, size=${size})}"
               th:text="${cat.name}"
               class="category-chip"
               th:classappend="${selectedCategory != null and selectedCategory.id == cat.id}? ' active'">
            </a>
        </div>
    </div>

    <!-- Thông báo nếu không có sản phẩm -->
    <div class="text-center py-5"
         th:if="${products == null or #lists.isEmpty(products.content)}">
        <div style="font-size:70px;">🔍</div>
        <h4 class="text-muted mt-3">
            Chưa có sản phẩm.
        </h4>
    </div>

    <!-- Danh sách sản phẩm -->
    <div class="row g-4"
         th:if="${products != null and !#lists.isEmpty(products.content)}">
        <div class="col-lg-3 col-md-4 col-sm-6"
             th:each="product : ${products.content}">
            <div class="card product-card">
                <a th:href="@{/product/{id}(id=${product.id})}">
                    <div class="product-img-wrap">
                        <img th:src="${product.imageUrl}"
                             th:alt="${product.name}">
                    </div>
                </a>
                <div class="card-body">
                    <h5 class="fw-bold"
                        th:text="${product.name}">
                    </h5>
                    <p class="price-tag mb-3"
                       th:text="${#numbers.formatDecimal(product.price,0,'COMMA',0,'POINT')} + 'đ'">
                    </p>

                    <!-- FORM THÊM VÀO GIỎ HÀNG DÙNG AJAX -->
                    <form th:action="@{/cart/add}" method="post" onsubmit="submitAddToCart(event, this)" class="mt-auto">
                        <input type="hidden" name="productId" th:value="${product.id}" />
                        <input type="hidden" name="quantity" value="1" />
                        <button type="submit" class="btn text-white w-100 fw-bold py-2" style="background-color: var(--primary); border-radius: 10px;">
                            <i class="fas fa-cart-plus me-2"></i> Thêm vào giỏ
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- THANH PHÂN TRANG (PAGINATION) CÓ GIỮ THAM SỐ SIZE -->
    <nav th:if="${products != null and products.totalPages > 1}" class="mt-5" aria-label="Page navigation">
        <ul class="pagination justify-content-center">
            <!-- Nút Previous -->
            <li class="page-item" th:classappend="${products.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/shop(page=${products.number - 1}, category=${selectedCategory != null ? selectedCategory.id : null}, size=${size})}">
                    <i class="fas fa-chevron-left"></i> Trước
                </a>
            </li>

            <!-- Các nút số trang -->
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                th:classappend="${i == products.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/shop(page=${i}, category=${selectedCategory != null ? selectedCategory.id : null}, size=${size})}"
                   th:text="${i + 1}">1</a>
            </li>

            <!-- Nút Next -->
            <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/shop(page=${products.number + 1}, category=${selectedCategory != null ? selectedCategory.id : null}, size=${size})}">
                    Sau <i class="fas fa-chevron-right"></i>
                </a>
            </li>
        </ul>
    </nav>
</section>

<!-- SCRIPT XỬ LÝ GIỎ HÀNG VÀ THAY ĐỔI SỐ LƯỢNG TRANG -->
<script>
    function submitAddToCart(event, formElement) {
        event.preventDefault();

        const formData = new FormData(formElement);

        fetch(formElement.action, {
            method: 'POST',
            body: formData
        })
            .then(response => {
                const btn = formElement.querySelector('button');
                const originalHtml = btn.innerHTML;

                btn.innerHTML = '<i class="fas fa-check me-2"></i> Đã thêm!';
                btn.style.backgroundColor = '#28a745';

                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                    btn.style.backgroundColor = 'var(--primary)';
                }, 1500);
            })
            .catch(error => {
                console.error('Lỗi kết nối:', error);
                alert('Không thể kết nối đến máy chủ!');
            });
    }

    // ĐOẠN NÀY ĐANG BỊ THIẾU TRONG CODE CỦA BẠN, HÃY THÊM VÀO:
    function changePageSize(select) {
        const newSize = select.value;
        const urlParams = new URLSearchParams(window.location.search);

        urlParams.set('size', newSize);
        urlParams.set('page', '0'); // Reset về trang đầu khi thay đổi kích thước

        // Giữ lại category nếu đang lọc theo danh mục
        // (URLSearchParams tự động giữ lại các param cũ, ta chỉ update 'size' và 'page')

        window.location.href = window.location.pathname + '?' + urlParams.toString();
    }
</script>
</body>
</html>
