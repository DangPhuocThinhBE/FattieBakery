<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: main_layout(~{::section}, 'Trang Chủ', ~{::extraStyles})}">
<head>
    <title>Trang Chủ - Fattie Bakery</title>
    <th:block th:fragment="extraStyles">
        <style>
            /* 1. Tông màu sang trọng */
            :root {
                --primary: #8B3238;       /* Đỏ nâu */
                --bg-cream: #FDFBF7;      /* Nền kem dịu nhẹ */
                --text-dark: #4A3728;     /* Nâu đậm */
            }

            body { background-color: var(--bg-cream) !important; color: var(--text-dark); font-family: 'Poppins', sans-serif; }

            /* 2. Hero Section */
            .hero { padding: 80px 0; }
            .btn-danger { background-color: var(--primary) !important; border-color: var(--primary) !important; padding: 12px 40px; }

            /* 3. Card Sản phẩm & Danh mục */
            .card { border: none; border-radius: 20px; transition: 0.4s; background: #ffffff; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
            .card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.1) !important; }

            /* Danh mục ảnh thực tế */
            .category-card { padding: 0; text-align: center; overflow: hidden; }
            .category-card img { width: 100%; height: 140px; object-fit: cover; }
            .category-card h6 { padding: 15px; margin: 0; font-weight: 700; }

            /* Background riêng cho phần danh mục */
            .bg-custom-cream { background-color: #F7F2EE; }

            .price-tag {
                color: var(--primary);
                font-weight: 700;
                font-size: 1.1rem;
            }
        </style>
    </th:block>
</head>
<body>
<section>
    <!-- HERO SECTION -->
    <section class="hero">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-6">
                    <span class="badge bg-danger px-3 py-2 mb-3">FATTIE BAKERY</span>
                    <h1 class="display-4 fw-bold">Fresh Cakes <br>& <span style="color: var(--primary);">Premium Tea</span></h1>
                    <p class="lead mt-4">Mang đến những chiếc bánh tươi mỗi ngày cùng trà trái cây và trà sữa thơm ngon được làm từ nguyên liệu cao cấp.</p>
                    <div class="mt-4">
                        <a href="/shop" class="btn btn-danger btn-lg">Khám Phá Menu</a>
                    </div>
                </div>
                <div class="col-lg-6">
                    <img src="https://res.cloudinary.com/gtf3svkg/image/upload/v1784975264/banner-fattieshop_afmtfd.jpg"
                         class="img-fluid rounded shadow-lg" alt="Cake">
                </div>
            </div>
        </div>
    </section>

    <!-- DANH MỤC (Lấy động từ Database & Cloudinary) -->
    <section class="py-5 bg-custom-cream">
        <div class="container text-center">
            <h2 class="fw-bold mb-5">Danh Mục Sản Phẩm</h2>
            <div class="row g-4 justify-content-center">
                <!-- Duyệt qua biến categories từ Controller truyền sang -->
                <div class="col-6 col-md-2" th:each="cat : ${categories}">
                    <div class="card category-card">
                        <!-- Trỏ link sang trang shop kèm id danh mục -->
                        <a th:href="@{/shop(category=${cat.id})}" class="text-decoration-none text-dark">
                            <!-- Lấy trực tiếp link ảnh Cloudinary từ cột imageUrl trong DB -->
                            <img th:src="${cat.imageUrl}" th:alt="${cat.name}">
                            <h6 th:text="${cat.name}"></h6>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- SẢN PHẨM NỔI BẬT -->
    <section class="py-5">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold"> Sản Phẩm Nổi Bật</h2>
                <a href="/shop" class="btn btn-outline-dark">Xem tất cả</a>
            </div>
            <div class="row g-4">
                <div class="col-lg-3 col-md-6" th:each="p : ${featuredProducts}">
                    <div class="card h-100 p-3">
                        <a th:href="@{/product/{id}(id=${p.id})}">
                            <img th:src="${p.imageUrl}" th:alt="${p.name}" class="card-img-top" style="height:240px; object-fit:cover; border-radius: 15px;">
                        </a>
                        <div class="card-body text-center d-flex flex-column justify-content-between">
                            <div>
                                <h5 class="fw-bold text-dark" th:text="${p.name}"></h5>
                                <p class="price-tag" th:text="${#numbers.formatDecimal(p.price,0,'COMMA',0,'POINT')} + 'đ'"></p>
                            </div>
                            <button class="btn btn-danger w-100 mt-3" th:onclick="|addToCart(${p.id})|">
                                <i class="fas fa-cart-plus me-2"></i> Thêm vào giỏ
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>


    <script th:inline="javascript">
        function addToCart(productId) {
            const headerElement = document.querySelector('meta[name="_csrf_header"]');
            const tokenElement = document.querySelector('meta[name="_csrf"]');

            let headers = {
                'Content-Type': 'application/x-www-form-urlencoded'
            };

            if (headerElement && tokenElement) {
                headers[headerElement.content] = tokenElement.content;
            }

            fetch('/api/cart/add', {
                method: 'POST',
                headers: headers,
                body: `productId=${productId}&quantity=1`
            })
                .then(response => {
                    if (response.ok) {
                        alert("Đã thêm sản phẩm vào giỏ hàng thành công! 🛒");
                    } else {
                        alert("Có lỗi xảy ra, vui lòng thử lại!");
                    }
                })
                .catch(error => {
                    console.error("Lỗi:", error);
                    alert("Không thể kết nối tới server!");
                });
        }
    </script>
</section>
</body>
</html>
