<!DOCTYPE html>
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="main_layout(content, title, extraStyles)">
<head>
    <meta charset="UTF-8">
    <th:block th:fragment="extraStyles">
        <style>
            /* --- BẢNG MÀU TỪ LOGO FATTIE BAKERY --- */
            :root {
                --logo-red: #8B3238;      /* Màu đỏ nâu từ logo */
                --logo-red-dark: #6F282D; /* Màu đỏ nâu đậm hơn khi hover */
                --bg-main: #FFFFFF;        /* Nền trang chính */
                --bg-soft-cream: #FFFDF8; /* Nền kem rất nhẹ */
                --text-main: #333333;      /* Màu chữ chính */
                --text-muted: #666666;    /* Màu chữ mờ */
            }

            body {
                color: var(--text-main);
                font-family: 'Montserrat', sans-serif; /* Bạn nên add font này vào header chung */
            }

            /* 1. CHỈNH NÚT ĐĂNG NHẬP (ĐỒNG BỘ MÀU LOGO) */
            .navbar .btn-primary,
            .header-links .btn-primary,
            .btn-login,
            a[href*='login'] {
                background-color: var(--logo-red) !important;
                border-color: var(--logo-red) !important;
                color: white !important;
                border-radius: 5px !important; /* Kiểu vuông vắn hơn, phù hợp với text logo */
                padding: 10px 25px !important;
                font-weight: 700 !important;
                text-transform: uppercase;
                letter-spacing: 1px;
                transition: all 0.3s ease !important;
                border: none !important;
            }

            .navbar .btn-primary:hover,
            .btn-login:hover,
            a[href*='login']:hover {
                background-color: var(--logo-red-dark) !important;
                box-shadow: 0 4px 10px rgba(139, 50, 56, 0.3);
            }

            /* 2. CSS BANNER HERO (TẠO CẢM GIÁC ẤM ÁP, SANG TRỌNG) */
            .hero {
                background-color: #F8F1EA; /* Màu kem nền nhẹ, tạo cảm giác ấm áp */
                padding: 120px 0;
                position: relative;
                overflow: hidden;
            }

            .hero h1 {
                font-size: 3.5rem;
                font-weight: 800;
                color: var(--logo-red); /* Dùng màu logo cho tiêu đề */
                line-height: 1.2;
                margin-bottom: 20px;
            }

            .hero h1 span {
                font-family: 'Playfair Display', serif; /* Font có chân sang trọng cho tên thương hiệu */
                font-style: italic;
                color: #5D4037; /* Màu nâu đậm sang trọng */
            }

            .hero p.lead {
                color: var(--text-muted);
                font-size: 1.2rem;
                max-width: 600px;
                margin-top: 30px;
            }

            .btn-hero {
                background: var(--logo-red);
                color: white;
                border: none;
                border-radius: 5px;
                padding: 18px 45px;
                font-weight: 800;
                font-size: 1rem;
                text-transform: uppercase;
                letter-spacing: 2px;
                box-shadow: 0 5px 15px rgba(139, 50, 56, 0.2);
                transition: all 0.3s ease;
                text-decoration: none;
                display: inline-block;
                margin-top: 40px;
            }
            .btn-hero:hover {
                background: var(--logo-red-dark);
                transform: translateY(-3px);
                box-shadow: 0 10px 25px rgba(139, 50, 56, 0.3);
                color: white;
            }

            /* Chỉnh ảnh Hero - Ảnh Bánh Trà Đẹp */
            .hero-img-wrap {
                position: relative;
                z-index: 2;
                padding: 20px;
            }
            .hero-img-wrap img {
                width: 100%;
                max-width: 550px;
                border-radius: 0; /* Vuông vắn sang trọng */
                box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
                border: 15px solid white;
                transition: transform 0.5s ease;
            }
            .hero-img-wrap:hover img {
                transform: scale(1.02);
            }

            /* 3. CARD SẢN PHẨM & NHÃN GIẢM GIÁ (ĐỒNG BỘ) */
            .product-card {
                border: 1px solid #EEEEEE; /* Viền mỏng */
                border-radius: 0; /* Vuông vắn */
                overflow: hidden;
                box-shadow: 0 2px 5px rgba(0,0,0,0.03);
                transition: all .3s;
                height: 100%;
                background: #fff;
            }
            .product-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 10px 30px rgba(139, 50, 56, 0.15);
                border-color: #E0E0E0;
            }

            .product-img-wrap {
                position: relative;
                overflow: hidden;
                background: #fff;
                height: 250px; /* Tăng chiều cao ảnh */
                display: flex;
                align-items: center;
                justify-content: center;
                border-bottom: 1px solid #EEEEEE;
            }
            .product-img-wrap img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                transition: 0.6s ease;
            }
            .product-card:hover .product-img-wrap img {
                transform: scale(1.08);
            }

            /* NHÃN GIẢM GIÁ MÀU ĐỎ LOGO */
            .discount-badge {
                position: absolute;
                top: 15px;
                right: 15px;
                background: var(--logo-red);
                color: white;
                padding: 5px 12px;
                border-radius: 0; /* Vuông vắn */
                font-weight: 800;
                font-size: 0.85rem;
                text-transform: uppercase;
                z-index: 10;
                box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            }

            .card-body {
                padding: 20px;
            }
            .card-body h6 {
                color: #212121;
                font-weight: 700;
                font-size: 1rem;
                margin-bottom: 5px;
            }

            .product-meta {
                color: var(--text-muted);
                font-size: 0.85rem;
                font-style: italic;
                margin-bottom: 15px;
            }

            .price-tag {
                color: var(--logo-red);
                font-weight: 800;
                font-size: 1.2rem;
            }

            .old-price {
                color: #9E9E9E;
                text-decoration: line-through;
                font-size: 0.9rem;
                margin-right: 10px;
            }

            .cart-btn {
                background: var(--logo-red);
                color: #fff;
                border: none;
                border-radius: 0; /* Vuông vắn */
                width: 42px;
                height: 42px;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: .2s;
                font-size: 1.1rem;
            }
            .cart-btn:hover {
                background: var(--logo-red-dark);
            }

            /* 4. CHỈNH Ô DỊCH VỤ (VUÔNG VẮN, SANG TRỌNG) */
            .service-box {
                position: relative;
                border-radius: 0; /* Vuông vắn */
                overflow: hidden;
                height: 280px;
                margin-bottom: 20px;
                border: 5px solid white; /* Tạo viền ảnh */
                box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            }
            .service-box img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                transition: transform 0.8s ease;
            }
            .service-box:hover img {
                transform: scale(1.1);
            }
            .service-box-overlay {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                background: linear-gradient(transparent, rgba(0,0,0,0.8));
                padding: 25px;
                color: white;
            }
            .service-box-overlay h4 {
                font-weight: 800;
                text-transform: uppercase;
                letter-spacing: 1px;
                margin-bottom: 10px;
            }

            /* CHỈNH CAROUSEL */
            #newHeroCarousel {
                border-radius: 0; /* Vuông vắn */
                overflow: hidden;
                box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            }

            /* Tiêu đề phần Sản phẩm nổi bật */
            .section-title {
                font-weight: 800;
                color: var(--logo-red);
                text-transform: uppercase;
                letter-spacing: 2px;
                position: relative;
                display: inline-block;
                padding-bottom: 15px;
            }
            .section-title::after {
                content: '';
                position: absolute;
                bottom: 0;
                left: 50%;
                transform: translateX(-50%);
                width: 60px;
                height: 3px;
                background: var(--logo-red);
            }
        </style>
    </th:block>
</head>
<body>

<section>
    <div class="hero">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-7 text-center text-lg-start">
                    <p class="text-uppercase fw-bold mb-2" style="letter-spacing: 3px; color: #A1887F;">Bánh Uyên Làm - Quà Uyên Gói</p>
                    <h1>Tiệm Bánh Thả Ga<br/>Cùng <span>Fattie Bakery</span></h1>
                    <p class="lead mt-4">Nơi khơi nguồn cảm hứng cho những bữa tiệc ngọt ngào. Khám phá thực đơn bánh handmade đa dạng, trà thơm hảo hạng được làm từ tâm huyết.</p>
                    <a href="/shop" class="btn-hero">Đặt Bánh Ngay <i class="fas fa-shopping-bag ms-2"></i></a>
                </div>

                <div class="col-lg-5 text-center d-none d-lg-block position-relative">
                    <div class="hero-img-wrap">
                        <!-- Fix o day >-->
                        <img th:src="@{/images/logo.png}" alt="Fattie Bakery Bánh và Trà" class="img-fluid">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="py-5 bg-white">
        <div class="container">
            <div id="newHeroCarousel" class="carousel slide mb-5" data-bs-ride="carousel">
                <div class="carousel-inner"> <!-- Fix o day >-->
                    <div class="carousel-item active"><img th:src="@{/images/logo.png}" class="d-block w-100" style="height: 450px; object-fit: cover;"></div>
                    <div class="carousel-item"><img th:src="@{/images/Snap-Insta.to_604053679_18550564957065359_1789945247235212627_n.jpg}" class="d-block w-100" style="height: 450px; object-fit: cover;"></div>
                    <div class="carousel-item"><img th:src="@{/images/Snap-Insta.to_605436871_18550564939065359_6479934919382566535_n.jpg}" class="d-block w-100" style="height: 450px; object-fit: cover;"></div>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-md-4" th:each="i : ${#numbers.sequence(1,3)}">
                    <a th:href="${i==1 ? '/menu' : (i==2 ? '/panna-cotta' : '/gift-boxes')}" class="text-decoration-none">
                        <div class="service-box shadow-sm">
                            <img th:src="@{'/images/Snap-Insta.to_605436871_18550564939065359_6479934919382566535_n.jpg' + ${i} + '.jpg'}">
                            <div class="service-box-overlay">
                                <h4 class="fw-bold text-white" th:text="${i==1?'Thực Đơn Bánh':(i==2?'Panna Cotta':(i==3?'Hộp Quà Ú Nu':''))}"></h4>
                                <div style="width: 50px; height: 3px; background: white; border-radius: 0;"></div>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="py-5" style="background: var(--bg-soft-cream);">
        <div class="container">
            <div class="text-center mb-5">
                <h2 class="section-title">✨ Tuyệt Phẩm Bánh & Trà ✨</h2>
            </div>

            <div class="row g-4">
                <div class="col-6 col-md-4 col-lg-3" th:each="p : ${featuredProducts}">
                    <div class="card product-card">
                        <div class="product-img-wrap">
                            <a th:href="@{/product/{id}(id=${p.id})}" style="width: 100%; height: 100%;">
                                <!-- Fix o day >-->
                                <img th:src="${p.imageUrl ?: '/images/Snap-Insta.to_604053679_18550564957065359_1789945247235212627_n.jpg.jpg'}" class="img-fluid" th:alt="${p.name}">
<!--                                     alt="Bánh Fattie">-->
                                <span th:if="${p.discountPercent > 0}" class="discount-badge" th:text="'-' + ${p.discountPercent} + '%'"></span>
                            </a>
                        </div>
                        <div class="card-body">
                            <h6 class="text-truncate" th:text="${p.name}">Tên Bánh/Trà</h6>
                            <p class="product-meta">Bánh handmade, nguyên liệu tươi</p>
                            <div class="d-flex justify-content-between align-items-center mt-3">
                                <div>
                                    <span th:if="${p.discountPercent > 0}" class="old-price" th:text="${#numbers.formatDecimal(p.originalPrice,0,'COMMA',0,'POINT')} + 'đ'"></span>
                                    <span class="price-tag" th:text="${#numbers.formatDecimal(p.price,0,'COMMA',0,'POINT')} + 'đ'"></span>
                                </div>
                                <button type="button" class="cart-btn" th:onclick="|addToCart('${p.id}')|"><i class="fas fa-shopping-basket"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            const myCarousel = document.querySelector('#newHeroCarousel');
            if (myCarousel) {
                new bootstrap.Carousel(myCarousel, { interval: 3500, ride: 'carousel' });
            }
        });

        function addToCart(productId) {
            const header = document.querySelector('meta[name="_csrf_header"]').content;
            const token = document.querySelector('meta[name="_csrf"]').content;
            fetch('/api/cart/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded', [header]: token },
                body: `productId=${productId}&quantity=1`
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const badge = document.querySelector('.cart-badge');
                        if (badge) { badge.textContent = data.cartCount; badge.classList.remove('d-none'); }
                        showToast("Đã thêm món vào giỏ hàng!", "success");
                    } else { showToast("Lỗi: " + data.message, "danger"); }
                }).catch(err => { showToast("Vui lòng đăng nhập để đặt bánh!", "warning"); });
        }

        function showToast(message, type) {
            const toastEl = document.getElementById('cartToast');
            const toastMsg = document.getElementById('toastMsg');
            if(toastEl && toastMsg) {
                // Thay đổi màu toast đồng bộ hơn
                toastEl.className = `toast align-items-center text-white bg-${type === 'success' ? 'dark' : (type === 'danger' ? 'danger' : 'warning')} border-0`;
                toastMsg.textContent = message;
                const toast = new bootstrap.Toast(toastEl);
                toast.show();
            }
        }
    </script>
</section>
</body>
</html>
