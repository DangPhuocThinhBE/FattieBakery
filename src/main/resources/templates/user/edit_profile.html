<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: main_layout(~{::section}, 'Cập nhật thông tin - Fattie Bakery', ~{::extraStyles})}">
<meta charset="UTF-8"/>
<head>
    <th:block th:fragment="extraStyles">
        <style>
            /* --- ĐỒNG BỘ BẢNG MÀU FATTIE BAKERY --- */
            :root {
                --logo-red: #8B3238;        /* Màu đỏ nâu từ logo */
                --logo-red-dark: #6F282D;   /* Màu đỏ nâu đậm khi hover */
                --bg-soft-cream: #FFFDF8;   /* Nền kem nhẹ ấm áp */
                --text-main: #333333;
                --text-muted: #666666;
            }

            body {
                font-family: 'Montserrat', sans-serif;
                background: var(--bg-soft-cream);
            }

            /* Chuyển sang phong cách vuông vắn, cứng cáp và sang trọng */
            .edit-card {
                border: 1px solid #EEEEEE;
                border-radius: 0;
                box-shadow: 0 4px 20px rgba(139, 50, 56, 0.04);
                background: #fff;
            }

            .form-control {
                border-radius: 0;
                padding: 12px 16px;
                border: 1px solid #DDE2E5;
                font-family: 'Montserrat', sans-serif;
            }
            .form-control:focus {
                border-color: var(--logo-red);
                box-shadow: none;
            }

            .font-playfair {
                font-family: 'Playfair Display', serif;
                font-weight: 700;
                font-style: italic;
                color: var(--logo-red);
            }

            /* Vùng chọn và xem trước ảnh đại diện */
            .upload-btn-wrapper { position: relative; overflow: hidden; display: inline-block; cursor: pointer; }
            .upload-btn-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; }

            /* Giữ khung avatar dạng vuông cổ điển bo nhẹ hoặc tròn tùy gu (ở đây chuyển sang vuông bo nhẹ cho sang) */
            .preview-container {
                width: 130px;
                height: 130px;
                margin: 0 auto 15px;
                border-radius: 0;
                overflow: hidden;
                border: 1px dashed var(--logo-red);
                background: #FCFAF2;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .preview-container img { width: 100%; height: 100%; object-fit: cover; }
            .preview-container i { font-size: 2rem; color: var(--logo-red); }

            /* Hệ thống nút bấm vuông vắn đồng bộ các trang trước */
            .btn-custom-submit {
                background: var(--logo-red);
                color: white !important;
                border: none;
                border-radius: 0;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 1px;
                transition: all 0.3s;
            }
            .btn-custom-submit:hover {
                background: var(--logo-red-dark);
            }

            .btn-custom-cancel {
                background: #f8f9fa;
                color: var(--text-muted) !important;
                border: 1px solid #DDE2E5;
                border-radius: 0;
                font-weight: 600;
                transition: all 0.3s;
            }
            .btn-custom-cancel:hover {
                background: #e9ecef;
            }
        </style>
    </th:block>
    <title></title>
</head>
<body>
<section class="py-5" style="background: var(--bg-soft-cream); min-height: 85vh;">
    <div class="container">
        <div class="edit-card p-4 p-md-5 mx-auto" style="max-width: 550px;">
            <h3 class="font-playfair text-center mb-1 fs-2">Sửa Hồ Sơ Của Bạn</h3>
            <p class="text-center text-muted small mb-4 text-uppercase fw-semibold" style="letter-spacing: 1px;">Cập nhật thông tin nhận bánh hàng ngày</p>

            <form th:action="@{/user/profile/update}" th:object="${user}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:field="*{id}">

                <!-- KHU VỰC ẢNH ĐẠI DIỆN -->
                <div class="mb-4 text-center">
                    <div class="preview-container shadow-sm" id="imagePreview">
                        <img th:if="${user.avatarUrl}" th:src="${user.avatarUrl}" alt="Preview">
                        <i th:unless="${user.avatarUrl}" class="fas fa-camera"></i>
                    </div>

                    <div class="upload-btn-wrapper">
                        <button class="btn btn-outline-dark btn-sm rounded-0 px-3 fw-semibold" type="button" style="font-size: 0.85rem;">
                            <i class="fas fa-cloud-upload-alt me-2"></i>Thay ảnh đại diện
                        </button>
                        <input type="file" name="avatarFile" id="avatarInput" accept="image/*" />
                    </div>
                </div>

                <!-- CÁC TRƯỜNG THÔNG TIN -->
                <div class="mb-3">
                    <label class="form-label fw-bold small text-dark">Họ và tên của bạn <span class="text-danger">*</span></label>
                    <label>
                        <input type="text" th:field="*{fullName}" class="form-control" placeholder="Nhập họ và tên..." required>
                    </label>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small text-dark">Số điện thoại liên hệ <span class="text-danger">*</span></label>
                    <label>
                        <input type="tel" th:field="*{phone}" class="form-control" placeholder="Nhập số điện thoại nhận hàng..." required>
                    </label>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold small text-dark">Địa chỉ giao bánh mặc định</label>
                    <label>
                        <textarea th:field="*{address}" class="form-control" rows="3" placeholder="Số nhà, tên đường, phường/xã..."></textarea>
                    </label>
                </div>

                <!-- HỆ THỐNG NÚT ĐIỀU HƯỚNG -->
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-custom-submit py-3 shadow-sm">
                        Lưu thay đổi hồ sơ
                    </button>
                    <a th:href="@{/user/profile}" class="btn btn-custom-cancel py-3 text-center text-decoration-none">
                        Hủy bỏ
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT XEM TRƯỚC ẢNH MƯỢT MÀ -->
    <script>
        document.getElementById('avatarInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const previewContainer = document.getElementById('imagePreview');
                    previewContainer.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</section>
</body>
</html>
