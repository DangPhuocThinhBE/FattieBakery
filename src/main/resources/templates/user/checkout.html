<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Thanh Toán - Fattie Bakery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet"/>
    <style>
        /* --- BẢNG MÀU ĐỒNG BỘ LOGO FATTIE BAKERY --- */
        :root {
            --logo-red: #8B3238;        /* Màu đỏ nâu từ logo */
            --logo-red-dark: #6F282D;   /* Màu đỏ nâu đậm khi hover */
            --bg-soft-cream: #FFFDF8;   /* Nền kem nhẹ ấm áp */
            --text-main: #333333;
            --text-muted: #666666;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg-soft-cream);
            color: var(--text-main);
        }

        /* Navbar thương hiệu tiệm bánh */
        .navbar-brand {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-style: italic;
            color: var(--logo-red)!important;
            font-size: 1.6rem;
            letter-spacing: 1px;
        }
        .navbar {
            background: #fff!important;
            box-shadow: 0 2px 15px rgba(139, 50, 56, 0.08);
            border-bottom: 1px solid #EEEEEE;
        }

        /* Chuyển sang bo góc vuông vắn cổ điển, sang trọng */
        .card {
            border: 1px solid #EEEEEE;
            border-radius: 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            background: #fff;
        }
        .form-control {
            border-radius: 0;
            padding: 12px 16px;
            border: 1px solid #DDE2E5;
        }
        .form-control:focus {
            border-color: var(--logo-red);
            box-shadow: none;
        }

        /* Nút xác nhận thanh toán */
        .btn-primary {
            background: var(--logo-red);
            border: none;
            border-radius: 0;
            font-weight: 700;
            padding: 16px;
            color: white !important;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            background: var(--logo-red-dark);
        }

        .btn-outline-secondary {
            border-radius: 0 !important;
            border-color: #9E9E9E;
            color: #616161;
        }
        .btn-outline-secondary:hover {
            background-color: #616161;
            border-color: #616161;
        }

        /* Item giỏ hàng mini */
        .cart-mini-item { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; margin-top: 3px}
        .img-container {
            position: relative;
            width: 65px;
            height: 65px;
            flex-shrink: 0;
            display: block;
        }
        .cart-mini-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0;
        }
        .qty-badge {
            position: absolute; top: -8px; right: -8px;
            background: var(--logo-red); color: white; border-radius: 50%;
            width: 22px; height: 22px; font-size: 11px;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid white; font-weight: 800; z-index: 5;
        }
        .item-info { flex-grow: 1; min-width: 0; }
        .item-name { font-weight: 700; font-size: 0.9rem; margin-bottom: 2px; color: #212121; }
        .item-price { color: var(--logo-red); font-weight: 800; font-size: 0.85rem; }

        /* Lựa chọn phương thức thanh toán */
        .payment-option {
            border: 1px solid #DDE2E5;
            border-radius: 0;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 100px;
            background: #fff;
        }
        .payment-option:hover {
            border-color: var(--logo-red);
            background-color: #FAF6F0;
        }
        .payment-option.selected {
            border-color: var(--logo-red);
            background-color: #FAF6F0;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 50, 56, 0.1);
        }

        .section-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            color: var(--logo-red);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .cart-items-list { max-height: 350px; overflow-y: auto; padding-right: 10px; }

        /* Khung hiển thị QR động mượt mà */
        #qrContainer {
            transition: all 0.35s ease-in-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        #qrContainer.show {
            max-height: 600px;
            opacity: 1;
            margin-top: 20px;
        }
        .qr-card {
            background: #FCFAF2;
            border: 1px dashed var(--logo-red);
            padding: 25px;
            text-align: center;
        }
        .qr-image {
            max-width: 220px;
            width: 100%;
            height: auto;
            border: 4px solid #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">🍰 Fattie Bakery</a>
        <div class="ms-auto">
            <a href="/cart" class="btn btn-outline-secondary btn-sm">Quay lại giỏ hàng</a>
        </div>
    </div>
</nav>

<div class="container py-2">
    <form th:action="@{/checkout/place-order}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="hidden" name="customerEmail" th:value="${user?.email}" />

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card sticky-top" style="top:90px;">
                    <div class="card-body p-4">
                        <div class="section-title"><i class="fas fa-shopping-basket me-2"></i> Đơn bánh của bạn</div>

                        <div class="cart-items-list mb-4">
                            <div th:each="item : ${cartItems}" class="cart-mini-item">
                                <div class="img-container" th:with="pImg=${item.product.imageUrl}">
                                    <img th:src="${pImg != null && !pImg.isEmpty() ?
                                         (pImg.startsWith('http') ? pImg :
                                         (pImg.startsWith('/') ? pImg : '/uploads/images/' + pImg))
                                         : '/images/default_bakery.png'}"
                                         class="cart-mini-img"
                                         style="width: 65px; height: 65px; object-fit: cover; border-radius: 0; border: 1px solid #eee;">

                                    <span class="qty-badge" th:text="${item.quantity}">1</span>
                                </div>
                                <div class="item-info text-truncate">
                                    <div class="item-name text-truncate" th:text="${item.product.name}">Tên sản phẩm</div>
                                    <div class="item-price" th:text="${#numbers.formatDecimal(item.product.price,0,'COMMA',0,'POINT')} + 'đ'">0đ</div>
                                </div>
                            </div>
                        </div>

                        <hr/>

                        <div class="summary-details">
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Tạm tính:</span>
                                <span class="fw-700 text-dark" th:text="${#numbers.formatDecimal(total,0,'COMMA',0,'POINT')} + 'đ'">0đ</span>
                            </div>

                            <div class="d-flex justify-content-between mb-2 text-danger" th:if="${discountAmount > 0}">
                                <span>Giảm giá:</span>
                                <span class="fw-700" th:text="'-' + ${#numbers.formatDecimal(discountAmount,0,'COMMA',0,'POINT')} + 'đ'">-0đ</span>
                            </div>

                            <input type="hidden" name="discountCode" th:value="${appliedCoupon}" />

                            <div class="d-flex justify-content-between mb-2 text-success">
                                <span>Phí vận chuyển:</span>
                                <span class="fw-700">Miễn phí 🎉</span>
                            </div>
                            <hr/>
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="fw-700 fs-5 text-dark">Tổng cộng:</span>
                                <span class="fw-800 fs-4 text-danger" id="displayTotal" th:text="${#numbers.formatDecimal(total - (discountAmount ?: 0), 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card mb-4 p-4">
                    <div class="section-title"><i class="fas fa-truck me-2"></i> Địa chỉ giao bánh</div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Họ tên người nhận <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="customerName" th:value="${user?.fullName}" required placeholder="Nhập tên người nhận bánh...">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Số điện thoại <span class="text-danger">*</span></label>
                            <input type="tel" class="form-control" name="customerPhone" th:value="${user?.phone}" required placeholder="Số điện thoại liên hệ ship...">
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-bold">Địa chỉ nhận hàng chi tiết <span class="text-danger">*</span></label>
                            <textarea class="form-control" name="shippingAddress" rows="2" th:text="${user?.address}" required placeholder="Số nhà, tên đường, Phường/Xã, Quận/Huyện..."></textarea>
                        </div>
                    </div>
                </div>

                <div class="card p-4 mb-4">
                    <div class="section-title mb-4">
                        <i class="fas fa-credit-card me-2"></i>
                        <span>Phương thức thanh toán</span>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="payment-option d-flex flex-column align-items-center justify-content-center text-center p-3 w-100" onclick="selectPayment(this)">
                                <input type="radio" name="paymentMethod" value="COD" checked class="d-none">
                                <i class="fas fa-money-bill-wave fa-2x mb-2 text-success"></i>
                                <div class="fw-bold small text-dark">Tiền mặt khi nhận bánh (COD)</div>
                            </label>
                        </div>
                        <div class="col-md-4">
                            <label class="payment-option d-flex flex-column align-items-center justify-content-center text-center p-3 w-100" onclick="selectPayment(this)">
                                <input type="radio" name="paymentMethod" value="BANK_TRANSFER" class="d-none">
                                <i class="fas fa-university fa-2x mb-2" style="color: #0d6efd;"></i>
                                <div class="fw-bold small text-dark">Chuyển khoản ngân hàng</div>
                            </label>
                        </div>
                        <div class="col-md-4">
                            <label class="payment-option d-flex flex-column align-items-center justify-content-center text-center p-3 w-100" onclick="selectPayment(this)">
                                <input type="radio" name="paymentMethod" value="MOMO" class="d-none">
                                <i class="fas fa-wallet fa-2x mb-2" style="color: #ae2070;"></i>
                                <div class="fw-bold small text-dark">Ví điện tử MoMo</div>
                            </label>
                        </div>
                    </div>

                    <div id="qrContainer">
                        <div class="qr-card shadow-sm">
                            <h6 class="fw-bold mb-2 text-dark" id="qrTitle">Mã QR Thanh Toán</h6>
                            <div class="mb-3" id="qrAccountInfo"></div>
                            <img src="" id="qrImg" class="qr-image mb-3" alt="Mã QR Chuyển khoản">
                            <div class="small text-muted p-2 bg-white border" id="qrInstruction"></div>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 shadow-sm fs-5">XÁC NHẬN ĐẶT HÀNG NGAY</button>
            </div>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    function selectPayment(el) {
        document.querySelectorAll('.payment-option').forEach(e => e.classList.remove('selected'));
        el.classList.add('selected');

        const input = el.querySelector('input');
        input.checked = true;

        toggleQRCode(input.value);
    }

    function toggleQRCode(method) {
        const qrContainer = document.getElementById('qrContainer');
        const qrTitle = document.getElementById('qrTitle');
        const qrAccountInfo = document.getElementById('qrAccountInfo');
        const qrImg = document.getElementById('qrImg');
        const qrInstruction = document.getElementById('qrInstruction');

        const totalAmount = document.getElementById('displayTotal').innerText;

        if (method === 'BANK_TRANSFER') {

            qrTitle.innerHTML = `<i class="fas fa-university me-2 text-primary"></i> CHUYỂN KHOẢN NGÂN HÀNG`;

            qrAccountInfo.innerHTML = `
                <div class="fw-bold text-dark fs-6">TECHCOMBANK</div>
                <div class="text-muted small">
                    Số tài khoản:
                    <span class="fw-bold text-dark">19034922582011</span>
                </div>
                <div class="text-muted small">
                    Chủ tài khoản:
                    <span class="fw-bold text-dark">HUYNH ANH HAO</span>
                </div>
            `;

            qrImg.src = "https://img.vietqr.io/image/techcombank-19034922582011-compact2.jpg";

            qrInstruction.innerHTML =
                `Vui lòng quét mã QR và chuyển đúng số tiền <strong class="text-danger">${totalAmount}</strong>.`;

            qrContainer.classList.add("show");

        } else if (method === "MOMO") {

            qrTitle.innerHTML =
                `<i class="fas fa-wallet me-2" style="color:#ae2070"></i> THANH TOÁN MOMO`;

            qrAccountInfo.innerHTML = `
                <div class="fw-bold" style="color:#ae2070">VÍ MOMO</div>
                <div class="text-muted small">
                    Fattie Bakery
                </div>
            `;

            qrImg.src = /*[[@{/images/QrMoMo.png}]]*/ "/images/QrMoMo.png";

            qrInstruction.innerHTML =
                `Mở ứng dụng <strong style="color:#ae2070">MoMo</strong> để quét mã QR và thanh toán <strong class="text-danger">${totalAmount}</strong>.`;

            qrContainer.classList.add("show");

        } else {

            qrContainer.classList.remove("show");

        }
    }

    document.addEventListener("DOMContentLoaded", function () {
        const cod = document.querySelector(".payment-option");
        if (cod) {
            cod.classList.add("selected");
            toggleQRCode("COD");
        }
    });
</script>
