<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Chi Tiết Đơn Hàng - Fattie Bakery Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --logo-red: #8B3238;
            --sidebar-bg: #221E1F;
            --bg-cream: #FFFDF8;
            --border-tan: #EADCC9;
        }
        body { font-family:'Montserrat',sans-serif; background:var(--bg-cream); }
        .font-playfair { font-family: 'Playfair Display', serif; }

        /* Sidebar phẳng, góc vuông */
        .sidebar { width: 260px; min-height: 100vh; background: var(--sidebar-bg); position: fixed; left: 0; top: 0; z-index: 100; border-right: 1px solid rgba(234, 220, 201, 0.1); }
        .sidebar-brand { font-family:'Playfair Display',serif; color:#EADCC9; font-size:1.4rem; padding:24px 20px; border-bottom:1px dashed #444; }
        .sidebar-item { display:flex; align-items:center; padding:13px 20px; color:rgba(255,255,255,.6); text-decoration:none; font-weight:600; font-size:0.85rem; text-transform:uppercase; }
        .sidebar-item:hover, .sidebar-item.active { color:#fff; background:rgba(139,50,56,.3); border-left:4px solid var(--logo-red); }

        .main-content { margin-left: 260px; padding: 24px; }
        .topbar { background: #fff; border: 1px solid var(--border-tan); padding: 16px 24px; margin-bottom: 24px; }
        .card { border: 1px solid var(--border-tan) !important; border-radius: 0 !important; background: #fff; box-shadow: none !important; }

        .form-select { border-radius: 0 !important; border: 1px solid var(--border-tan); padding: 10px 16px; }
        .btn-bakery { background: var(--logo-red); color: white; border-radius: 0 !important; font-weight: 700; text-transform: uppercase; }
        .table thead th { background: var(--logo-red); color: white; border: none; font-size: 0.85rem; text-transform: uppercase; }
        .info-label { color: #888; font-size: 0.75rem; text-transform: uppercase; font-weight: 700; margin-bottom: 2px; }
        .info-value { font-weight: 700; color: #333; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-brand"><i class="fas fa-cookie-bite me-2"></i>Fattie Admin</div>
    <div class="py-2">
        <a href="/admin/orders" class="sidebar-item active"><i class="fas fa-mug-hot"></i> Đơn Đặt Bàn & Ship</a>
        <a href="/admin/dashboard" class="sidebar-item"><i class="fas fa-chart-line"></i> Tổng Quan</a>
        <a href="/admin/products" class="sidebar-item"><i class="fas fa-bread-slice"></i> Thực Đơn</a>
    </div>
</div>

<div class="main-content">
    <div class="topbar d-flex justify-content-between align-items-center">
        <h5 class="mb-0 fw-bold font-playfair" style="color:var(--logo-red);">📋 ĐƠN HÀNG: <span th:text="${order.orderCode}">#FT001</span></h5>
        <a href="/admin/orders" class="btn btn-outline-dark rounded-0 px-3"><i class="fas fa-arrow-left me-2"></i>Trở lại</a>
    </div>

    <div class="row g-4">
        <div class="col-md-8">
            <div class="card p-4 mb-4">
                <h6 class="fw-bold mb-3 font-playfair"><i class="fas fa-user me-2" style="color:var(--logo-red);"></i>Thông Tin Khách Hàng</h6>
                <div class="row g-3">
                    <div class="col-md-6"><div class="info-label">Họ tên</div><div class="info-value" th:text="${order.customerName}">Nguyễn Văn A</div></div>
                    <div class="col-md-6"><div class="info-label">Số điện thoại</div><div class="info-value" th:text="${order.customerPhone}">090...</div></div>
                    <div class="col-12"><div class="info-label">Địa chỉ</div><div class="info-value" th:text="${order.shippingAddress}">...</div></div>
                </div>
            </div>

            <div class="card p-0">
                <div class="p-3 border-bottom" style="border-color: var(--border-tan) !important;">
                    <h6 class="fw-bold mb-0 font-playfair"><i class="fas fa-list me-2" style="color:var(--logo-red);"></i>Thực Đơn Đã Gọi</h6>
                </div>
                <table class="table mb-0">
                    <thead><tr><th>Sản phẩm</th><th>Giá</th><th>SL</th><th>Thành tiền</th></tr></thead>
                    <tbody>
                    <tr th:each="item : ${order.orderItems}">
                        <td class="fw-bold" th:text="${item.productName}">Bánh Sừng Bò</td>
                        <td th:text="${#numbers.formatDecimal(item.productPrice,0,'COMMA',0,'POINT')} + 'đ'">...</td>
                        <td th:text="${item.quantity}">1</td>
                        <td class="fw-bold" style="color:var(--logo-red);" th:text="${#numbers.formatDecimal(item.subtotal,0,'COMMA',0,'POINT')} + 'đ'">...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-4">
                <h6 class="fw-bold mb-3 font-playfair"><i class="fas fa-cog me-2" style="color:var(--logo-red);"></i>Điều Phối Đơn Hàng</h6>
                <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post">
                    <div class="mb-3">
                        <label class="info-label">Trạng thái xử lý</label>
                        <select class="form-select" name="status">
                            <option th:each="s : ${orderStatuses}" th:value="${s.name()}" th:selected="${s == order.status}" th:text="${s.name()}"></option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-bakery w-100 py-2">Cập Nhật Trạng Thái</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
