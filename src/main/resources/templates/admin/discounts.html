<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ưu Đãi Tiệc Trà - Fattie Bakery Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet"/>
    <style>
        :root { --logo-red: #8B3238; --sidebar-bg: #221E1F; --bg-cream: #FFFDF8; --border-tan: #EADCC9; }
        body { font-family:'Montserrat',sans-serif; background:var(--bg-cream); }
        .sidebar { width: 260px; min-height: 100vh; background: var(--sidebar-bg); position: fixed; left: 0; top: 0; z-index: 100; border-right: 1px solid rgba(234, 220, 201, 0.1); }
        .sidebar-brand { font-family:'Playfair Display',serif; color:#EADCC9; font-size:1.4rem; padding:24px 20px; border-bottom:1px dashed #444; }
        .sidebar-item { display:flex; align-items:center; padding:13px 20px; color:rgba(255,255,255,.6); text-decoration:none; font-weight:600; font-size:0.85rem; text-transform:uppercase; }
        .sidebar-item:hover, .sidebar-item.active { color:#fff; background:rgba(139,50,56,.3); border-left:4px solid var(--logo-red); }
        .main-content { margin-left:260px; padding:24px; }
        .topbar { background:#fff; border:1px solid var(--border-tan); padding:16px 24px; margin-bottom:24px; }
        .card { border:1px solid var(--border-tan); border-radius:0 !important; background:#fff; }
        .form-control, .form-select { border-radius:0 !important; border:1px solid var(--border-tan); }
        .btn-bakery { background:var(--logo-red); color:white; border-radius:0 !important; font-weight:700; text-transform:uppercase; }
        .table thead { background:var(--logo-red); color:white; }
        .code-badge { font-family:monospace; font-weight:800; padding:4px 12px; border:1px solid var(--logo-red); color:var(--logo-red); }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-brand"><i class="fas fa-cookie-bite me-2"></i>Fattie Admin</div>
    <div class="sidebar-menu">
        <a href="/admin/dashboard" class="sidebar-item"><i class="fas fa-chart-line"></i> Tổng quan lò bánh</a>
        <a href="/admin/products" class="sidebar-item"><i class="fas fa-bread-slice"></i> Thực đơn bánh & trà</a>
        <a href="/admin/categories" class="sidebar-item"><i class="fas fa-tags"></i> Danh mục</a>
        <a href="/admin/orders" class="sidebar-item"><i class="fas fa-mug-hot"></i> Đơn đặt bàn</a>
        <a href="/admin/discounts" class="sidebar-item active"><i class="fas fa-percentage"></i> Ưu đãi tiệc trà</a>
        <a href="/logout" class="sidebar-item text-danger"><i class="fas fa-sign-out-alt"></i> Đăng xuất</a>
    </div>
</div>

<div class="main-content">
    <div class="topbar"><h5 class="mb-0 fw-bold text-uppercase" style="color:var(--logo-red);"> ƯU ĐÃI TIỆC TRÀ</h5></div>

    <div class="row g-4">
        <!-- FORM THÊM / SỬA MÃ GIẢM GIÁ -->
        <div class="col-md-4">
            <div class="card p-4">
                <h6 class="fw-bold mb-3" id="formTitle"><i class="fas fa-plus-circle me-2" style="color:var(--logo-red);"></i>Thiết lập ưu đãi mới</h6>
                <form th:action="@{/admin/discounts/save}" th:object="${discount}" method="post" id="discountForm">
                    <input type="hidden" th:field="*{id}" id="discountId"/>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Mã Ưu Đãi</label>
                        <input type="text" class="form-control" th:field="*{code}" id="discountCode" required style="text-transform:uppercase;"/>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Loại Ưu Đãi</label>
                        <select class="form-select" th:field="*{discountType}" id="discountType">
                            <option value="PERCENTAGE">Phần trăm (%)</option>
                            <option value="FIXED_AMOUNT">Số tiền (đ)</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Giá Trị</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{discountValue}" id="discountValue" required/>
                    </div>

                    <!-- Bổ sung input Thời gian bắt đầu -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Thời gian bắt đầu</label>
                        <input type="datetime-local" class="form-control" th:field="*{startDate}" id="discountStartDate"/>
                    </div>

                    <!-- Bổ sung input Thời gian kết thúc -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Thời gian kết thúc (Hạn dùng)</label>
                        <input type="datetime-local" class="form-control" th:field="*{endDate}" id="discountEndDate"/>
                        <div class="form-text text-muted" style="font-size: 0.75rem;">Để trống nếu muốn mã có hiệu lực vô thời hạn.</div>
                    </div>

                    <button type="submit" class="btn btn-bakery w-100 py-2">Lưu Mã Ưu Đãi</button>
                </form>
            </div>
        </div>

        <!-- BẢNG DANH SÁCH MÃ GIẢM GIÁ -->
        <div class="col-md-8">
            <div class="card">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                        <tr>
                            <th>Mã</th>
                            <th>Giảm</th>
                            <th>Hạn dùng</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="d : ${discounts}">
                            <td class="align-middle"><span class="code-badge" th:text="${d.code}"></span></td>
                            <td class="align-middle fw-bold" th:text="${d.discountType == 'PERCENTAGE' ? d.discountValue + '%' : #numbers.formatDecimal(d.discountValue,0,'COMMA',0,'POINT') + 'đ'}"></td>
                            <td class="align-middle small" th:text="${d.endDate != null ? #temporals.format(d.endDate, 'dd/MM/yyyy HH:mm') : 'Vô thời hạn'}"></td>
                            <td class="align-middle">
                                <span th:class="${d.active ? 'badge bg-success' : 'badge bg-secondary'}" th:text="${d.active ? 'Đang chạy' : 'Đã ẩn'}"></span>
                            </td>
                            <td class="align-middle">
                                <!-- Nút Chỉnh sửa -->
                                <button type="button" class="btn btn-sm btn-outline-dark rounded-0 me-1"
                                        th:data-id="${d.id}"
                                        th:data-code="${d.code}"
                                        th:data-type="${d.discountType}"
                                        th:data-value="${d.discountValue}"
                                        th:data-start="${d.startDate != null ? #temporals.format(d.startDate, 'yyyy-MM-dd') + 'T' + #temporals.format(d.startDate, 'HH:mm') : ''}"
                                        th:data-end="${d.endDate != null ? #temporals.format(d.endDate, 'yyyy-MM-dd') + 'T' + #temporals.format(d.endDate, 'HH:mm') : ''}"
                                        onclick="handleEdit(this)">
                                    <i class="fas fa-edit"></i>
                                </button>

                                <!-- Nút Xóa (Dùng form POST có hỏi xác nhận) -->
                                <form th:action="@{/admin/discounts/delete/{id}(id=${d.id})}" method="post" class="d-inline" onsubmit="return confirm('Bạn có chắc chắn muốn xóa mã ưu đãi này không?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger rounded-0">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <!-- Thông báo nếu danh sách trống -->
                        <tr th:if="${discounts.isEmpty()}">
                            <td colspan="5" class="text-center py-4">Chưa có mã ưu đãi nào được tạo.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function handleEdit(btn) {
        document.getElementById('formTitle').innerHTML = '<i class="fas fa-edit me-2" style="color:#8B3238;"></i>Chỉnh sửa mã';
        document.getElementById('discountId').value = btn.getAttribute('data-id');
        document.getElementById('discountCode').value = btn.getAttribute('data-code');
        document.getElementById('discountType').value = btn.getAttribute('data-type');
        document.getElementById('discountValue').value = btn.getAttribute('data-value');
        document.getElementById('discountStartDate').value = btn.getAttribute('data-start') || '';
        document.getElementById('discountEndDate').value = btn.getAttribute('data-end') || '';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
</body>
</html>
