<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Quản Lý Thực Đơn - Fattie Bakery Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --logo-red: #8B3238;
            --sidebar-bg: #221E1F;
            --bg-cream: #FFFDF8;
            --border-tan: #EADCC9;
        }
        body { font-family:'Montserrat',sans-serif; background:var(--bg-cream); }
        .font-playfair { font-family: 'Playfair Display', serif; }

        /* Sidebar phẳng, góc vuông */
        .sidebar { width: 260px; min-height: 100vh; background: var(--sidebar-bg); position: fixed; left: 0; top: 0; z-index: 100; border-right: 1px solid rgba(234, 220, 201, 0.1); }
        .sidebar-brand { font-family:'Playfair Display',serif; color:#EADCC9; font-size:1.4rem; padding:24px 20px; border-bottom:1px dashed #444; }
        .sidebar-item { display:flex; align-items:center; padding:13px 20px; color:rgba(255,255,255,.6); text-decoration:none; font-weight:600; font-size:0.85rem; text-transform:uppercase; }
        .sidebar-item:hover, .sidebar-item.active { color:#fff; background:rgba(139,50,56,.3); border-left:4px solid var(--logo-red); }

        .main-content { margin-left: 260px; padding: 24px; }
        .topbar { background: #fff; border: 1px solid var(--border-tan); padding: 16px 24px; margin-bottom: 24px; }

        .card { border: 1px solid var(--border-tan) !important; border-radius: 0 !important; background: #fff; box-shadow: none !important; }
        .form-control, .form-select { border-radius: 0 !important; border: 1px solid var(--border-tan); padding: 10px 16px; }
        .btn-bakery { background: var(--logo-red); color: white; border-radius: 0 !important; font-weight: 700; text-transform: uppercase; }
        .btn-cancel { background: #fff; color: #555; border: 1px solid #ccc; border-radius: 0 !important; }

        #imgPreview { border: 1px solid var(--border-tan); padding: 5px; object-fit: cover; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-brand"><i class="fas fa-cookie-bite me-2"></i>Fattie Admin</div>
    <div class="sidebar-menu">
        <a href="/admin/products" class="sidebar-item active"><i class="fas fa-bread-slice"></i> Thực Đơn Bánh & Trà</a>
        <a href="/admin/dashboard" class="sidebar-item"><i class="fas fa-chart-line"></i> Tổng Quan Lò Bánh</a>
        <a href="/admin/orders" class="sidebar-item"><i class="fas fa-mug-hot"></i> Đơn Đặt Bàn</a>
    </div>
</div>

<div class="main-content">
    <div class="topbar d-flex justify-content-between align-items-center">
        <h5 class="mb-0 fw-bold font-playfair" style="color:var(--logo-red);">
            <span th:if="${product.id == null}"><i class="fas fa-plus me-2"></i>THÊM MẺ BÁNH MỚI</span>
            <span th:unless="${product.id == null}"><i class="fas fa-edit me-2"></i>CHỈNH SỬA THỰC ĐƠN</span>
        </h5>
    </div>

    <div class="card p-4">
        <form th:action="@{/admin/products/save}" th:object="${product}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:field="*{id}"/>
            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="mb-3">
                        <label class="small fw-bold">TÊN BÁNH / TRÀ</label>
                        <input type="text" class="form-control" th:field="*{name}" required/>
                    </div>
                    <div class="mb-3">
                        <label class="small fw-bold">MÔ TẢ CHI TIẾT</label>
                        <textarea class="form-control" th:field="*{description}" rows="4"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="small fw-bold">GIÁ BÁN (VNĐ)</label>
                            <input type="number" class="form-control" th:field="*{price}" required/>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="small fw-bold">SỐ LƯỢNG TRONG LÒ</label>
                            <input type="number" class="form-control" th:field="*{stockQuantity}"/>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <label class="small fw-bold">HÌNH ẢNH SẢN PHẨM</label>
                    <div class="p-2 border" style="border-style: dashed !important; border-color: var(--border-tan) !important;">
                        <img id="imgPreview" th:src="${product.imageUrl}" class="w-100 mb-2" style="display:none;"/>
                        <input type="file" class="form-control border-0" name="imageFile" accept="image/*" onchange="previewImage(this)"/>
                    </div>
                </div>
            </div>

            <div class="mt-4 pt-3 border-top">
                <button type="submit" class="btn btn-bakery px-4 py-2">Lưu vào thực đơn</button>
                <a href="/admin/products" class="btn btn-cancel px-4 py-2">Hủy bỏ</a>
            </div>
        </form>
    </div>
</div>

<script>
    function previewImage(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) {
                var preview = document.getElementById('imgPreview');
                preview.src = e.target.result;
                preview.style.display = 'block';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
</body>
</html>
