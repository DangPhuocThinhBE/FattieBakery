<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Quản Lý Khách Hàng - Fattie Bakery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --logo-red: #8B3238;
            --sidebar-bg: #221E1F;
            --bg-cream: #FFFDF8;
            --border-tan: #EADCC9;
        }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg-cream); }
        .font-playfair { font-family: 'Playfair Display', serif; }

        .sidebar { width: 260px; min-height: 100vh; background: var(--sidebar-bg); position: fixed; left: 0; top: 0; z-index: 100; border-right: 1px solid rgba(234, 220, 201, 0.1); }
        .sidebar-brand { font-family: 'Playfair Display', serif; color: #EADCC9; font-size: 1.4rem; padding: 24px 20px; border-bottom: 1px dashed #444; }
        .sidebar-item { display: flex; align-items: center; padding: 13px 20px; color: rgba(255,255,255,.6); text-decoration: none; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; }
        .sidebar-item:hover, .sidebar-item.active { color: #fff; background: rgba(139,50,56,.3); border-left: 4px solid var(--logo-red); }

        .main-content { margin-left: 260px; padding: 24px; }
        .topbar { background: #fff; border: 1px solid var(--border-tan); padding: 16px 24px; margin-bottom: 24px; }

        .card { border: 1px solid var(--border-tan) !important; border-radius: 0 !important; background: #fff; box-shadow: none !important; }
        .btn-bakery { background: var(--logo-red); color: white; border-radius: 0 !important; font-weight: 700; text-transform: uppercase; }

        .table thead th { background: var(--logo-red); color: white; border: none; font-size: 0.8rem; text-transform: uppercase; }
        .avatar-circle { width: 38px; height: 38px; background: var(--border-tan); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--logo-red); font-weight: 700; }
        .badge-active { background: #e8f5e9; color: #2e7d32; border-radius: 0; font-size: 0.7rem; }
        .badge-locked { background: #ffebee; color: #c62828; border-radius: 0; font-size: 0.7rem; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-brand">
        <i class="fas fa-cookie-bite me-2"></i>Fattie Admin
    </div>
    <div class="sidebar-menu">
        <a href="/admin/users" class="sidebar-item active"><i class="fas fa-users"></i> Khách Hàng</a>
        <a href="/admin/products" class="sidebar-item"><i class="fas fa-bread-slice"></i> Thực Đơn</a>
        <a href="/admin/orders" class="sidebar-item"><i class="fas fa-mug-hot"></i> Đơn Hàng</a>
    </div>
</div>

<div class="main-content">
    <div class="topbar">
        <h5 class="mb-0 fw-bold font-playfair" style="color: var(--logo-red);"> QUẢN LÝ KHÁCH HÀNG</h5>
    </div>

    <div class="card mb-4 p-3">
        <form method="get" action="/admin/users" class="row g-3 align-items-end">
            <div class="col-md-9">
                <label class="small fw-bold">TÌM KIẾM HỘI VIÊN</label>
                <input type="text" class="form-control rounded-0" name="keyword" th:value="${keyword}" placeholder="Nhập tên hoặc email..."/>
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-bakery w-100">Tìm kiếm</button>
            </div>
        </form>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Khách hàng</th>
                    <th>Email</th>
                    <th>Vai trò</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u, stat : ${users.content}">
                    <td class="align-middle" th:text="${stat.index + 1}">1</td>
                    <td class="align-middle">
                        <div class="d-flex align-items-center gap-2">
                            <div class="avatar-circle" th:text="${#strings.substring(u.username, 0, 1).toUpperCase()}">A</div>
                            <div class="fw-bold" th:text="${u.fullName ?: u.username}">Tên KH</div>
                        </div>
                    </td>
                    <td class="align-middle" th:text="${u.email}">...</td>
                    <td class="align-middle">
                            <span th:each="role : ${u.roles}"
                                  th:text="${role.name == 'ROLE_ADMIN' ? 'Quản trị' : 'Thành viên'}"
                                  class="badge bg-dark">Role</span>
                    </td>
                    <td class="align-middle">
                            <span th:class="${u.active ? 'badge badge-active' : 'badge badge-locked'}"
                                  th:text="${u.active ? 'Hoạt động' : 'Đã khóa'}"></span>
                    </td>
                    <td class="align-middle">
                        <div class="d-flex align-items-center gap-2">
                            <!-- 1. Form khóa / mở khóa tài khoản -->
                            <form th:action="@{/admin/users/toggle/{id}(id=${u.id})}" method="post" class="mb-0">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" class="btn btn-sm btn-outline-dark rounded-0" th:title="${u.active ? 'Khóa tài khoản' : 'Mở khóa tài khoản'}">
                                    <i th:class="${u.active ? 'fas fa-lock' : 'fas fa-unlock'}"></i>
                                </button>
                            </form>

                            <!-- 2. Form cấp / gỡ quyền Quản trị (ROLE_ADMIN) -->
                            <form th:action="@{/admin/users/role/{id}(id=${u.id})}" method="post" class="mb-0">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" class="btn btn-sm btn-outline-danger rounded-0" title="Chuyển đổi quyền Quản trị / Thành viên">
                                    <i class="fas fa-user-shield"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
